<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AniReco: Your Anime Guide</title> <!-- JSON ACTIVITY -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #14151f;
            color: #e6e6f0;
        }

        .title {
            color: #b794f6;
        }

        .card {
            background-color: #1e2030;
            color: #e6e6f0;
            border-color: #3b3560;
            border-radius: 10px;
            overflow: hidden;
        }

        .card-img-top {
            height: 350px;
            object-fit: cover;
        }

        .input-group-text,
        .form-control {
            background-color: #1e2030;
            color: #e6e6f0;
            border-color: #3b3560;
        }

        .form-control:focus {
            background-color: #1e2030;
            color: #e6e6f0;
            border-color: #b794f6;
            box-shadow: 0 0 0 0.25rem rgba(183, 148, 246, 0.25);
        }

        .form-control::placeholder {
            color: #8b8ba3;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <div class="text-center mb-4">
            <h1 class="title fw-bold">AniReco</h1>
            <p class="text-secondary">Find Your Next Favorite Anime.</p>
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text">Search</span>
                        <input type="text" id="search" class="form-control" placeholder="Title, genre, or details..."
                            oninput="showAnime()">
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4" id="parent">



        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        var anime = [
            {
                title: "Spy x Family",
                image: "Assets/POSTER_SPY.jpg",
                genres: "Action, Comedy",
                description: "A spy creates a fake family for a secret mission, unaware that his new family members have secrets of their own.",
                episodes: "37 episodes (Seasons 1-2)",
                status: "Ongoing",
                year: 2022,
                studio: "Wit Studio and CloverWorks",
                watchPlatform: "Crunchyroll",
                watchUrl: "https://www.crunchyroll.com/search?q=Spy%20x%20Family",
                readPlatform: "Viz",
                readUrl: "https://www.viz.com/search?search=Spy%20x%20Family"
            }, {
                title: "Frieren: Beyond Journey's End",
                image: "Assets/POSTER_FRIEREN.jpg",
                genres: "Adventure, Fantasy, Drama",
                description: "After the hero's party defeats the Demon King, the elf mage Frieren sets out to understand the humans she once travelled with.",
                episodes: "28 episodes (Season 1)",
                status: "Ongoing",
                year: 2023,
                studio: "Madhouse",
                watchPlatform: "Crunchyroll",
                watchUrl: "https://www.crunchyroll.com/search?q=Frieren",
                readPlatform: "Viz",
                readUrl: "https://www.viz.com/search?search=Frieren"
            }, {
                title: "Haikyu!!",
                image: "Assets/POSTER_HAIKYUU.jpg",
                genres: "Sports, Comedy, Drama",
                description: "Short but determined Shoyo Hinata joins his school's volleyball team and teams up with his genius rival Tobio Kageyama.",
                episodes: "85 episodes (Seasons 1-4)",
                status: "Finished",
                year: 2014,
                studio: "Production I.G",
                watchPlatform: "Crunchyroll",
                watchUrl: "https://www.crunchyroll.com/search?q=Haikyu",
                readPlatform: "Viz",
                readUrl: "https://www.viz.com/search?search=Haikyu"
            }, {
                title: "Kaguya-sama: Love Is War",
                image: "Assets/POSTER_KAGUYA.jpg",
                genres: "Romance, Comedy",
                description: "Two brilliant student council leaders refuse to confess first, so every attempt at love becomes a battle of wits.",
                episodes: "37 episodes (Seasons 1-3)",
                status: "Finished",
                year: 2019,
                studio: "A-1 Pictures",
                watchPlatform: "Crunchyroll",
                watchUrl: "https://www.crunchyroll.com/search?q=Kaguya-sama",
                readPlatform: "Viz",
                readUrl: "https://www.viz.com/search?search=Kaguya-sama"
            }, {
                title: "Violet Evergarden",
                image: "Assets/POSTER_VIOLET.jpg",
                genres: "Drama, Fantasy",
                description: "A former soldier becomes an Auto Memory Doll, writing letters for others while learning what the words 'I love you' mean.",
                episodes: "13 episodes (TV series)",
                status: "Finished",
                year: 2018,
                studio: "Kyoto Animation",
                watchPlatform: "Netflix",
                watchUrl: "https://www.netflix.com/search?q=Violet%20Evergarden",
                readPlatform: "BookWalker",
                readUrl: "https://global.bookwalker.jp/search/?word=Violet%20Evergarden"
            }, {
                title: "Demon Slayer: Kimetsu no Yaiba",
                image: "Assets/POSTER_KIMETSU.jpg",
                genres: "Action, Fantasy",
                description: "After his family is slaughtered and his sister turned into a demon, Tanjiro becomes a demon slayer to find a cure.",
                episodes: "63 episodes (Seasons 1-4)",
                status: "Ongoing",
                year: 2019,
                studio: "ufotable",
                watchPlatform: "Crunchyroll",
                watchUrl: "https://www.crunchyroll.com/search?q=Demon%20Slayer",
                readPlatform: "Viz",
                readUrl: "https://www.viz.com/search?search=Demon%20Slayer"
            }, {
                title: "The Apothecary Diaries",
                image: "Assets/POSTER_APOTHECARY.jpg",
                genres: "Mystery, Historical, Drama",
                description: "Maomao, an apothecary sold into the imperial palace, uses her medical knowledge to solve poisonings and court mysteries.",
                episodes: "48 episodes (Seasons 1-2)",
                status: "Ongoing",
                year: 2023,
                studio: "OLM and TOHO animation STUDIO",
                watchPlatform: "Crunchyroll",
                watchUrl: "https://www.crunchyroll.com/search?q=The%20Apothecary%20Diaries",
                readPlatform: "Manga UP! Global",
                readUrl: "https://global.manga-up.com/"
            }, {
                title: "Bocchi the Rock!",
                image: "Assets/POSTER_BOCHI.jpg",
                genres: "Comedy, Music, Slice of Life",
                description: "Painfully shy guitarist Hitori 'Bocchi' Gotoh finally gets her chance to join a band and face her social anxiety.",
                episodes: "12 episodes (Season 1)",
                status: "Finished",
                year: 2022,
                studio: "CloverWorks",
                watchPlatform: "Crunchyroll",
                watchUrl: "https://www.crunchyroll.com/search?q=Bocchi%20the%20Rock",
                readPlatform: "BookWalker",
                readUrl: "https://global.bookwalker.jp/search/?word=Bocchi%20the%20Rock"
            }
        ]

        var parent = document.getElementById("parent");

        function showAnime() {
            var search = document.getElementById("search").value.toLowerCase();
            parent.innerHTML = "";

            for (var i = 0; i < anime.length; i++) {
                var details = anime[i].title + " " + anime[i].genres + " " + anime[i].description + " " + anime[i].year + " " + anime[i].studio + " " + anime[i].status;

                if (details.toLowerCase().includes(search)) {
                    parent.innerHTML += `
            <div class="col-12 col-sm-6 col-md-6 col-lg-4 col-xl-3 col-xxl-3">
              <div class="card h-100 border border-1">
                <img src="` + anime[i].image + `" class="card-img-top" alt="` + anime[i].title + `">
                <div class="card-body d-flex flex-column">
                  <h5 class="card-title">` + anime[i].title + `</h5>
                  <div class="mb-2">
                    <span class="badge text-bg-secondary">` + anime[i].genres + `</span>
                  </div>
                  <p class="card-text small">` + anime[i].description + `</p>
                  <ul class="list-unstyled small">
                    <li><b>Episodes:</b> ` + anime[i].episodes + `</li>
                    <li><b>Status:</b> ` + anime[i].status + `</li>
                    <li><b>Year:</b> ` + anime[i].year + `</li>
                    <li><b>Studio:</b> ` + anime[i].studio + `</li>
                  </ul>
                  <div class="small text-secondary mt-auto mb-2">
                    Watch: ` + anime[i].watchPlatform + ` | Read: ` + anime[i].readPlatform + `
                  </div>
                  <div class="d-flex gap-2">
                    <a href="` + anime[i].watchUrl + `" class="btn btn-primary rounded-pill flex-fill" target="_blank" rel="noopener noreferrer">Watch</a>
                    <a href="` + anime[i].readUrl + `" class="btn btn-outline-light rounded-pill flex-fill" target="_blank" rel="noopener noreferrer">Read</a>
                  </div>
                </div>
              </div>
            </div>
          `;
                }
            }

            if (parent.innerHTML == "") {
                parent.innerHTML = `<p class="text-center text-secondary">No anime found.</p>`;
            }
        }

        showAnime();
    </script>

</body>

</html>
